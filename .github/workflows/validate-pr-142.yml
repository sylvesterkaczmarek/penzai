name: Validate Penzai PR 142

on:
  push:
    branches:
      - validate-penzai-142

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/core/shapecheck_hashable_axis_names_test.py tests/core/shapecheck_test.py -q
      - run: pyink --check penzai/core/shapecheck.py tests/core/shapecheck_hashable_axis_names_test.py
